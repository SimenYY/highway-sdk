[tool.poetry]
name = "highway-sdk"
version = "3.1.0"
description = "Python SDK for Highway commonly used mechanical and electrical device and intelligent device."
authors = ["AdzLovelace <heyinyu.sensi@foxmail.com>"]
license = "GPL-3.0"
readme = "README.md"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.8.2"
filelock = "^3.18.0"
pydantic-settings = "^2.11.0"
platformdirs = "^4.5.1"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "supplemental"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^1.3.0"
sphinx-rtd-theme = "^3.0.2"
furo = "^2024.8.6"
sphinx-autobuild = "^2024.10.3"
sphinx-copybutton = "^0.5.2"
sphinx-tabs = "^3.4.7"
pre-commit = "^4.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ================= Ruff 全局配置 =================
[tool.ruff]
# 目标版本
target-version = "py311"
# 每行最大长度
line-length = 120
# 全局缩进宽度 (必须放在这里，不能放在 [tool.ruff.format] 下)
indent-width = 4

# 排除不需要检查的目录
exclude = [".git", ".venv", "build", "dist"]

# ================= Ruff Lint 配置 =================
[tool.ruff.lint]
# 规则选择
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (导入排序)
    "B",   # flake8-bugbear (发现潜在漏洞)
    "C90", # mccabe (检查代码复杂度)
    "N",   # pep8-naming (规范命名)
    "UP",  # pyupgrade (升级新版语法)
    "RUF", # Ruff 专用规则
]

# 忽略的规则
ignore = [
    "E501",   # 忽略行长度（由 formatter 处理）
    "E203",   # 冒号前空格（与 formatter 兼容性）
    "B008",   # 允许函数参数中定义对象（对 Pydantic 友好）
    "RUF001", # 字符串中包含全角标点符号
    "RUF002", # 文档字符串中包含全角标点符号
    "RUF003", # 注释中包含全角标点符号
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
# 自动合并来自同一模块的导入
combine-as-imports = true
# 识别当前项目为第一方包
known-first-party = ["highway_sdk"]

# ================= Ruff Format 配置 =================
[tool.ruff.format]
# 引号样式
quote-style = "double"
# 缩进方式
indent-style = "space"
# 自动处理末尾逗号
skip-magic-trailing-comma = false
# 换行符
line-ending = "auto"
